# Reusable reverse-proxy settings for device junction locations.
# Include from each junction location after setting:
#   junction_device  - registry key (e.g. f5_bigip)
#   junction_prefix  - URI prefix (e.g. /f5)

set $device_upstream "";

access_by_lua_file /etc/openresty/lua/junction/access.lua;
header_filter_by_lua_file /etc/openresty/lua/junction/header_filter.lua;
body_filter_by_lua_file /etc/openresty/lua/junction/body_filter.lua;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $proxy_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_ssl_server_name on;
proxy_ssl_verify off;
proxy_redirect off;
proxy_buffering off;

proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

proxy_pass $device_upstream;
