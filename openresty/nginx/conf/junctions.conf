# Device junction routes.
# Add one location block per device type; each block only sets identifiers
# and includes the shared junction proxy snippet.

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Bare session id without junction prefix (common mistake: /f5lb1/ instead of /f5/f5lb1/)
location ~ ^/([A-Za-z0-9._-]+)/?$ {
    default_type application/json;
    content_by_lua_block {
        local proxy_util = require "lib.proxy_util"
        local session_id = ngx.var[1]
        return proxy_util.deny(ngx.HTTP_BAD_REQUEST,
            "missing junction prefix: use /f5/" .. session_id .. "/ not /" .. session_id .. "/")
    }
}

location /f5/ {
    # F5 BIG-IP Load Balancer (TMUI)
    set $junction_device "f5_bigip";
    set $junction_prefix "/f5";
    include conf/snippets/junction-proxy.conf;
}

location /f5lb/ {
    # F5 alias (same device module as /f5/)
    set $junction_device "f5_bigip";
    set $junction_prefix "/f5lb";
    include conf/snippets/junction-proxy.conf;
}

location /f5_load_balancer/ {
    # F5 alias matching common device_type name
    set $junction_device "f5_bigip";
    set $junction_prefix "/f5_load_balancer";
    include conf/snippets/junction-proxy.conf;
}

location /infoblox/ {
    set $junction_device "infoblox";
    set $junction_prefix "/infoblox";
    include conf/snippets/junction-proxy.conf;
}

location /zdns/ {
    set $junction_device "zdns";
    set $junction_prefix "/zdns";
    include conf/snippets/junction-proxy.conf;
}

location /ise/ {
    set $junction_device "cisco_ise_tacacs";
    set $junction_prefix "/ise";
    include conf/snippets/junction-proxy.conf;
}
