# Device junction routes.
# Add one location block per device type; each block only sets identifiers
# and includes the shared junction proxy snippet.

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /f5/ {
    set $junction_device "f5_bigip";
    set $junction_prefix "/f5";
    include conf/snippets/junction-proxy.conf;
}

location /infoblox/ {
    set $junction_device "infoblox";
    set $junction_prefix "/infoblox";
    include conf/snippets/junction-proxy.conf;
}

location /zdns/ {
    set $junction_device "zdns";
    set $junction_prefix "/zdns";
    include conf/snippets/junction-proxy.conf;
}

location /ise/ {
    set $junction_device "cisco_ise_tacacs";
    set $junction_prefix "/ise";
    include conf/snippets/junction-proxy.conf;
}
