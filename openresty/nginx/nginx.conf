worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'junction=$junction_device session=$session_id upstream=$device_upstream';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Required for dynamic proxy_pass hostnames stored in Valkey.
    # Use Docker DNS (127.0.0.11), kube-dns, or your resolver IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    lua_package_path "/etc/openresty/lua/?.lua;/etc/openresty/lua/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/openresty/site/lualib/?.so;;";

    init_by_lua_block {
        local modules = {
            "lib.cors",
            "lib.json",
            "lib.valkey",
            "lib.junction_session",
            "lib.device_registry",
            "lib.proxy_util",
            "lib.html_rewrite",
            "lib.upstream_fetch",
            "devices.f5_bigip",
        }

        for _, name in ipairs(modules) do
            local ok, err = pcall(require, name)
            if not ok then
                ngx.log(ngx.ERR, "failed to preload lua module ", name, ": ", err)
                error("failed to preload lua module " .. name .. ": " .. tostring(err))
            end
        end
    }

    server {
        listen 8080;
        server_name _;

        # Variables populated by junction Lua handlers.
        set $junction_device "";
        set $junction_prefix "";
        set $session_id "";
        set $device_upstream "";

        include conf/junctions.conf;
    }
}
